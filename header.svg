<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Atiqullah — Software Engineer and Security Researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E182E"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#060A14"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.12" cy="0.5" r="0.38">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.86" cy="0.45" r="0.36">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFD3FF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="20"/></clipPath>
    <clipPath id="win"><rect x="830" y="50" width="400" height="300" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#glowL)"/>
    <rect width="1280" height="400" fill="url(#glowR)"/>

    <g stroke="#6B8CFF" stroke-opacity="0.05" stroke-width="1.5">
      <path d="M0 100H1280M0 200H1280M0 300H1280"/>
      <path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
    </g>

    <!-- shield mark -->
    <g transform="translate(70 96) scale(0.3) translate(-234 -176)">
      <path d="M512 176 L790 284 V516 C790 694 664 806 512 872 C360 806 234 694 234 516 V284 Z" fill="#3B82F6" opacity="0.5" filter="url(#blur)"/>
      <path d="M512 176 L790 284 V516 C790 694 664 806 512 872 C360 806 234 694 234 516 V284 Z" fill="url(#shield)"/>
      <path d="M512 228 L744 316 V514 C744 664 640 760 512 818 C384 760 280 664 280 514 V316 Z" fill="#07101F" fill-opacity="0.92"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="40">
        <path d="M418 446 L340 524 L418 602" stroke="#22D3EE"/>
        <path d="M606 446 L684 524 L606 602" stroke="#A78BFA"/>
        <path d="M544 436 L480 612" stroke="#F8FAFC"/>
      </g>
    </g>

    <!-- name + title -->
    <g font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="290" y="142" font-size="76" font-weight="700" fill="url(#name)" letter-spacing="0.5">Atiqullah</text>
      <rect x="293" y="162" width="72" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="290" y="208" font-size="25" font-weight="600" fill="#E2E8F0">Software Engineer <tspan fill="#38BDF8">·</tspan> Security Researcher</text>
    </g>

    <!-- skill pills with brand dots -->
    <g font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#CBD5E1">
      <rect x="290" y="238" width="108" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="310" cy="257" r="5" fill="#54C5F8"/><text x="324" y="263">Flutter</text>

      <rect x="410" y="238" width="86" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="430" cy="257" r="5" fill="#00B4AB"/><text x="444" y="263">Dart</text>

      <rect x="508" y="238" width="104" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="528" cy="257" r="5" fill="#FFD43B"/><text x="542" y="263">Python</text>

      <rect x="624" y="238" width="158" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="644" cy="257" r="5" fill="#F43F5E"/><text x="658" y="263">Web Security</text>
    </g>

    <!-- email -->
    <g transform="translate(290 304)">
      <rect x="0" y="0" width="26" height="18" rx="3" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <path d="M2 3L13 11L24 3" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="330" y="319" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#CBD5E1" letter-spacing="0.3">atiqullah61111@gmail.com</text>

    <!-- VS Code window -->
    <g filter="url(#shadow)">
      <rect x="830" y="50" width="400" height="300" rx="12" fill="#1E1E1E"/>
    </g>
    <g clip-path="url(#win)">
      <rect x="830" y="50" width="400" height="300" fill="#1E1E1E"/>
      <!-- title bar -->
      <rect x="830" y="50" width="400" height="32" fill="#2D2D30"/>
      <circle cx="850" cy="66" r="5.5" fill="#FF5F57"/>
      <circle cx="868" cy="66" r="5.5" fill="#FEBC2E"/>
      <circle cx="886" cy="66" r="5.5" fill="#28C840"/>
      <text x="1030" y="70" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9DA5B4" text-anchor="middle">scanner.py — Visual Studio Code</text>
      <!-- tab bar -->
      <rect x="830" y="82" width="400" height="30" fill="#252526"/>
      <rect x="830" y="82" width="120" height="30" fill="#1E1E1E"/>
      <rect x="830" y="82" width="120" height="2" fill="#007ACC"/>
      <circle cx="848" cy="98" r="4.5" fill="#FFD43B"/>
      <text x="860" y="102" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF">scanner.py</text>
      <!-- gutter -->
      <g font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="13" fill="#6E7681" text-anchor="end">
        <text x="864" y="138">1</text><text x="864" y="159">2</text><text x="864" y="180">3</text>
        <text x="864" y="201">4</text><text x="864" y="222">5</text><text x="864" y="243">6</text>
        <text x="864" y="264">7</text><text x="864" y="285">8</text><text x="864" y="306">9</text>
      </g>
      <!-- code -->
      <g font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="13" fill="#D4D4D4">
        <text x="880" y="138"><tspan fill="#C586C0">import</tspan> <tspan fill="#4EC9B0">requests</tspan></text>
        <text x="880" y="159"><tspan fill="#C586C0">from</tspan> <tspan fill="#4EC9B0">checks</tspan> <tspan fill="#C586C0">import</tspan> <tspan fill="#4EC9B0">XSS</tspan>, <tspan fill="#4EC9B0">SQLi</tspan></text>
        <text x="880" y="201"><tspan fill="#569CD6">class</tspan> <tspan fill="#4EC9B0">Scanner</tspan>:</text>
        <text x="911" y="222"><tspan fill="#569CD6">def</tspan> <tspan fill="#DCDCAA">run</tspan>(<tspan fill="#9CDCFE">self</tspan>, <tspan fill="#9CDCFE">target</tspan>):</text>
        <text x="942" y="243"><tspan fill="#C586C0">for</tspan> <tspan fill="#9CDCFE">check</tspan> <tspan fill="#C586C0">in</tspan> (<tspan fill="#4EC9B0">XSS</tspan>, <tspan fill="#4EC9B0">SQLi</tspan>):</text>
        <text x="973" y="264"><tspan fill="#C586C0">yield</tspan> <tspan fill="#DCDCAA">check</tspan>(<tspan fill="#9CDCFE">target</tspan>)</text>
        <text x="880" y="306" fill="#6A9955"># secure by design</text>
      </g>
      <!-- active line highlight bar + cursor -->
      <rect x="1023" y="296" width="1.5" height="14" fill="#AEAFAD"/>
      <!-- status bar -->
      <rect x="830" y="328" width="400" height="22" fill="#007ACC"/>
      <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#FFFFFF">
        <text x="844" y="343">main</text>
        <text x="1216" y="343" text-anchor="end">Python    UTF-8    Ln 9, Col 20</text>
      </g>
    </g>
    <rect x="830.5" y="50.5" width="399" height="299" rx="11.5" fill="none" stroke="url(#edge)"/>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
</svg>
